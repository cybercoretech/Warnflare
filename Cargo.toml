[package]
name = "warnflare"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Alert rules for self-hosted machines: failed and re-failed systemd units, stale jobs, journal patterns, webhook events, quiet hours"
license = "MIT"
repository = "https://github.com/cybercoretech/warnflare"
keywords = ["alerts", "systemd", "monitoring", "self-hosted", "journal"]
categories = ["command-line-utilities"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
